[package]
name = "fws-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Shared persistent stdio supervisor primitives for FWS runtimes"

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "time", "process", "fs", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }

[dev-dependencies]
tempfile = "3"
