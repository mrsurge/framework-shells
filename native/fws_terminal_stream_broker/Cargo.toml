[package]
name = "fws_terminal_stream_broker"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "fws-terminal-stream-broker"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
