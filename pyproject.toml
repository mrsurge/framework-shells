[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framework_shells"
version = "0.0.49"
description = "Framework-agnostic process orchestration with PTY, pipe, and dtach backends."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi",
  "aiofiles",
  "pyyaml",
  "python-socketio>=5,<6",
]

[project.scripts]
fws = "framework_shells.cli.main:main"
fs = "framework_shells.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["framework_shells*"]

[tool.setuptools.package-data]
framework_shells = ["ui/*", "bin/*", "fws_pipe_pump*.so", "fws_pipe_pump*.pyd", "fws_pipe_pump*.dylib", "fws_pipe_pump*.dll"]
