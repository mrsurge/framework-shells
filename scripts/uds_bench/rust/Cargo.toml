[package]
name = "fws-envelope-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
capnp = "=0.27.0"
flatbuffers = "=25.12.19"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "time", "macros"] }

[build-dependencies]
capnpc = "=0.27.0"
